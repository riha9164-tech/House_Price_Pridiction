<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Predict House Price</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="predict-page">

<!--  NAVBAR  -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">🏠 HousePrice</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/predict">Predict</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about">About</a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!--  FORM  -->

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="prediction-card">

                <h2 class="text-center mb-4">

                    House Price Prediction

                </h2>

                <form action="/prediction" method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Square Footage

                            </label>

                            <input type="number"

                                   class="form-control"

                                   name="square_footage"

                                   placeholder="Enter Square Footage"

                                   required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Bedrooms

                            </label>

                            <input type="number"

                                   class="form-control"

                                   name="bedrooms"

                                   placeholder="No. of Bedrooms"

                                   required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Bathrooms

                            </label>

                            <input type="number"

                                   class="form-control"

                                   name="bathrooms"

                                   placeholder="No. of Bathrooms"

                                   required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Year Built

                            </label>

                            <input type="number"

                                   class="form-control"

                                   name="year_built"

                                   placeholder="Construction Year"

                                   required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Lot Size

                            </label>

                            <input type="number"

                                   step="0.01"

                                   class="form-control"

                                   name="lot_size"

                                   placeholder="Lot Size"

                                   required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Garage Size

                            </label>

                            <input type="number"

                                   class="form-control"

                                   name="garage_size"

                                   placeholder="Garage Capacity"

                                   required>

                        </div>

                        <div class="col-md-12 mb-4">

                            <label class="form-label">

                                Neighborhood Quality

                            </label>

                            <input type="number"

                                   step="0.1"

                                   class="form-control"

                                   name="neighborhood_quality"

                                   placeholder="1 - 10"

                                   required>

                        </div>

                    </div>

                    <div class="text-center">

                        <button class="btn btn-primary btn-lg w-100">

                            Predict House Price

                        </button>

                    </div>

                </form>

                {% if prediction_text %}

                <div class="alert alert-danger mt-4">

                    {{ prediction_text }}

                </div>

                {% endif %}

            </div>

        </div>

    </div>

</div>

<!--  FOOTER  -->

<footer class="text-center p-3 bg-dark text-white">

    © 2026 House Price Prediction | Machine Learning Project

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
